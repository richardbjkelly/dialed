name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install playwright pillow
      - run: playwright install --with-deps chromium
      - run: python tests/run_all.py
