<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>dialed</title>
<link rel="manifest" href="/dialed/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="dialed">
<meta name="theme-color" content="#2a1510">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500&family=Lora:ital,wght@0,400;0,700;1,400&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,700;1,9..144,400&family=Inter:wght@300;400;500&family=Space+Grotesk:wght@300;400;500&family=Space+Mono:wght@400;700&family=Josefin+Sans:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --espresso: #2a1510;
    --crema: #c0593a;
    --crema-light: #d97a5a;
    --milk: #faf0eb;
    --foam: #fdf6f3;
    --roast: #6b2a1a;
    --green: #2d5016;
    --green-light: #4a7a28;
    --red: #8b1a1a;
    --blue: #2a5080;
    --text: #2a1510;
    --text-muted: #7a4a3a;
    --border: rgba(100,40,25,0.15);
    --card: rgba(255,255,255,0.7);
    --radius: 16px;
    --radius-sm: 10px;
    /* dark mode palette */
    --dm-bg: #111111;
    --dm-surface: #1e1e1e;
    --dm-card: #242424;
    --dm-input: #2a2a2a;
    --dm-input-focus: #323232;
    --dm-text: #f0ece8;
    --dm-text-muted: #888888;
    --dm-border: rgba(255,255,255,0.1);
    --dm-pill: rgba(255,255,255,0.06);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--foam); color: var(--text); min-height: 100vh; overflow-x: hidden; }
  body::before { content: ''; position: fixed; inset: 0; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E"); pointer-events: none; z-index: 0; opacity: 0.4; }

  .app-header { background: var(--espresso); color: var(--milk); padding: 20px 20px 0; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 20px rgba(26,15,10,0.3); }
  .header-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .app-title { font-family: 'Playfair Display', serif; font-size: 26px; letter-spacing: -0.5px; color: var(--crema); }
  .app-subtitle { font-size: 11px; color: rgba(245,237,227,0.5); font-family: 'DM Mono', monospace; letter-spacing: 2px; text-transform: uppercase; }
  .nav-tabs { display: flex; gap: 0; overflow-x: hidden; }
  .nav-tabs::-webkit-scrollbar { display: none; }
  .nav-tab { flex: 1; padding: 12px 4px; background: none; border: none; color: rgba(245,237,227,0.45); font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.5px; text-transform: uppercase; cursor: pointer; border-bottom: 2px solid transparent; transition: all 0.2s; white-space: nowrap; text-align: center; }
  .nav-tab.active { color: var(--crema-light); border-bottom-color: var(--crema); }

  .view { display: none; padding: 20px; position: relative; z-index: 1; padding-bottom: 100px; }
  .view.active { display: block; }
  .section-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--espresso); margin-bottom: 4px; }
  .section-subtitle { font-size: 12px; color: var(--text-muted); font-family: 'DM Mono', monospace; margin-bottom: 20px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 16px; backdrop-filter: blur(8px); box-shadow: 0 2px 12px rgba(26,15,10,0.06); }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text); margin-bottom: 6px; opacity: 0.75; }
  .form-input, .form-select, .form-textarea { width: 100%; padding: 11px 14px; background: var(--foam); border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; transition: border-color 0.2s; -webkit-appearance: none; }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--crema); background: white; }
  .form-textarea { resize: none; height: 80px; line-height: 1.5; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .extraction-picker { display: flex; gap: 8px; margin-top: 4px; }
  .extraction-btn { flex: 1; padding: 10px 6px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); background: var(--foam); font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; text-align: center; color: var(--text-muted); }
  .extraction-btn.under { --btn-color: #4a7ad0; }
  .extraction-btn.good { --btn-color: var(--green-light); }
  .extraction-btn.over { --btn-color: var(--red); }
  .extraction-btn.selected { background: var(--btn-color); border-color: var(--btn-color); color: white; }
  .rating-row { display: flex; gap: 6px; margin-top: 4px; }
  .star-btn { font-size: 24px; background: none; border: none; cursor: pointer; opacity: 0.25; transition: opacity 0.15s, transform 0.15s; padding: 2px; line-height: 1; color: var(--crema); }
  .star-btn.active { opacity: 1; color: var(--crema); }
  .btn-primary { width: 100%; padding: 14px; background: var(--espresso); color: var(--crema-light); border: none; border-radius: var(--radius-sm); font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 2px; text-transform: uppercase; cursor: pointer; transition: background 0.2s, transform 0.1s; margin-top: 8px; }
  .btn-primary:active { transform: scale(0.98); }
  .btn-secondary { background: none; border: 1.5px solid var(--border); color: var(--text-muted); padding: 10px 16px; border-radius: var(--radius-sm); font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
  .coffee-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(26,15,10,0.06); cursor: pointer; transition: all 0.2s; }
  .coffee-card-header { background: var(--espresso); padding: 14px 18px; display: flex; align-items: center; justify-content: space-between; }
  .coffee-card-name { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--milk); }
  .coffee-card-roaster { font-family: 'DM Mono', monospace; font-size: 10px; color: rgba(245,237,227,0.55); letter-spacing: 1px; margin-top: 2px; }
  .coffee-card-body { padding: 14px 18px; }
  .coffee-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .meta-pill { font-family: 'DM Mono', monospace; font-size: 10px; padding: 3px 8px; background: rgba(200,135,58,0.1); border: 1px solid rgba(200,135,58,0.2); border-radius: 20px; color: var(--roast); }
  .recipe-count { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-muted); }
  .recipe-entry { background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 10px; }
  .recipe-entry-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .extraction-tag { font-family: 'DM Mono', monospace; font-size: 10px; padding: 2px 8px; border-radius: 20px; letter-spacing: 1px; text-transform: uppercase; white-space: nowrap; }
  .tag-under { background: rgba(74,122,208,0.1); color: #4a7ad0; border: 1px solid rgba(74,122,208,0.25); }
  .tag-good { background: rgba(74,122,40,0.1); color: var(--green-light); border: 1px solid rgba(74,122,40,0.25); }
  .tag-over { background: rgba(139,26,26,0.1); color: var(--red); border: 1px solid rgba(139,26,26,0.25); }
  .recipe-params { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .param-block { text-align: center; background: var(--foam); border-radius: 8px; padding: 8px 4px; }
  .param-value { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--espresso); line-height: 1; }
  .param-label { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; margin-top: 3px; }
  .recipe-notes { font-size: 13px; color: var(--text-muted); line-height: 1.5; font-style: italic; border-top: 1px solid var(--border); padding-top: 10px; margin-top: 4px; }
  .btn-delete { background: none; border: none; color: rgba(139,26,26,0.4); cursor: pointer; font-size: 16px; padding: 4px; }
  .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.5; }
  .empty-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--text-muted); margin-bottom: 6px; }
  .empty-desc { font-size: 13px; line-height: 1.6; }
  .fab { position: fixed; bottom: 28px; right: 24px; width: 56px; height: 56px; border-radius: 50%; background: var(--crema); color: var(--espresso); border: none; font-size: 26px; cursor: pointer; box-shadow: 0 4px 20px rgba(200,135,58,0.5); display: flex; align-items: center; justify-content: center; transition: all 0.15s; z-index: 200; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(26,15,10,0.6); z-index: 300; display: none; align-items: flex-end; backdrop-filter: blur(2px); }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--foam); border-radius: 24px 24px 0 0; width: 100%; max-height: 92vh; overflow-y: auto; padding: 0 20px 40px; animation: slideUp 0.3s cubic-bezier(0.16,1,0.3,1); }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-handle { width: 36px; height: 4px; background: rgba(26,15,10,0.2); border-radius: 2px; margin: 14px auto 20px; }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--espresso); margin-bottom: 4px; }
  .modal-subtitle { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 24px; }
  .divider { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: var(--crema); margin: 20px 0 14px; display: flex; align-items: center; gap: 8px; }
  .divider::after { content: ''; flex: 1; height: 1px; background: rgba(200,135,58,0.25); }
  .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--espresso); color: var(--crema-light); padding: 10px 20px; border-radius: 20px; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px; opacity: 0; transition: all 0.3s; z-index: 500; white-space: nowrap; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px; }
  .stat-block { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 14px 10px; text-align: center; }
  .stat-value { font-family: 'Playfair Display', serif; font-size: 24px; color: var(--espresso); }
  .stat-label { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); margin-top: 3px; }
  .coffee-selector { display: flex; flex-direction: column; gap: 8px; margin-bottom: 4px; max-height: 180px; overflow-y: auto; }
  .coffee-selector-item { padding: 10px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; transition: all 0.15s; background: var(--foam); }
  .coffee-selector-item.selected { border-color: var(--crema); background: rgba(200,135,58,0.08); }
  .cs-name { font-family: 'Playfair Display', serif; font-size: 15px; }
  .cs-sub { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .method-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .method-tab { padding: 7px 12px; border: 1.5px solid var(--border); border-radius: 20px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; background: var(--foam); color: var(--text-muted); transition: all 0.15s; }
  .method-tab.selected { background: var(--espresso); border-color: var(--espresso); color: var(--crema-light); }
  .detail-back { display: flex; align-items: center; gap: 8px; background: none; border: none; font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 1px; color: var(--text-muted); cursor: pointer; padding: 0; margin-bottom: 20px; text-transform: uppercase; }
  .detail-hero { background: var(--espresso); border-radius: var(--radius); padding: 22px; margin-bottom: 20px; }


  /* Label image upload */
  .label-upload-btn { width:100%; padding:14px; background:var(--foam); border:1.5px dashed rgba(200,135,58,0.4); border-radius:var(--radius-sm); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; cursor:pointer; transition:all 0.2s; }
  .label-upload-btn:hover { border-color:var(--crema); background:rgba(200,135,58,0.04); }
  .label-upload-btn span { font-family:'DM Mono',monospace; font-size:10px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-muted); }
  .label-preview { width:100%; border-radius:var(--radius-sm); overflow:hidden; position:relative; margin-top:4px; }
  .label-preview img { width:100%; max-height:200px; object-fit:cover; border-radius:var(--radius-sm); display:block; }
  .label-preview-remove { position:absolute; top:6px; right:6px; background:rgba(26,15,10,0.7); color:white; border:none; border-radius:50%; width:24px; height:24px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; line-height:1; }
  /* Thumbnail in brew cards */
  .coffee-rating-row { display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; }
  .coffee-rating-btn { background:none; border:none; cursor:pointer; opacity:0.2; transition:opacity 0.15s; padding:1px; color:var(--crema); }
  .coffee-rating-btn.active { opacity:1; }
  .brew-label-thumb { width:48px; height:48px; border-radius:8px; object-fit:cover; flex-shrink:0; border:1px solid var(--border); }

  /* GRINDER STYLES */
  .grinder-type-toggle { display: flex; background: rgba(26,15,10,0.06); border-radius: 10px; padding: 3px; margin-bottom: 20px; }
  .type-btn { flex: 1; padding: 9px 12px; border: none; border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; background: none; color: var(--text-muted); transition: all 0.2s; }
  .type-btn.active { background: var(--espresso); color: var(--crema-light); }
  .grinder-search { position: relative; margin-bottom: 16px; }
  .grinder-search input { width: 100%; padding: 11px 14px 11px 38px; background: white; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: 'DM Sans', sans-serif; font-size: 14px; color: var(--text); outline: none; }
  .grinder-search input:focus { border-color: var(--crema); }
  .grinder-search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 16px; opacity: 0.4; pointer-events: none; }
  .grinder-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: all 0.15s; }
  .grinder-card.in-compare { border-color: var(--crema); background: rgba(200,135,58,0.05); }
  .grinder-brand { font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; color: var(--text-muted); text-transform: uppercase; }
  .grinder-model { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--espresso); margin-top: 2px; }
  .grinder-type-badge { font-family: 'DM Mono', monospace; font-size: 9px; padding: 2px 8px; border-radius: 20px; letter-spacing: 1px; text-transform: uppercase; display: block; margin-bottom: 4px; }
  .badge-manual { background: rgba(42,80,128,0.1); color: var(--blue); border: 1px solid rgba(42,80,128,0.2); }
  .badge-electric { background: rgba(92,45,14,0.1); color: var(--roast); border: 1px solid rgba(92,45,14,0.2); }
  .compare-toggle-btn { background: none; border: none; cursor: pointer; font-size: 20px; padding: 4px 6px; line-height: 1; transition: transform 0.15s; }
  .compare-toggle-btn:active { transform: scale(1.3); }

  /* Compare floating bar */
  .compare-bar { position: fixed; bottom: 90px; left: 16px; right: 16px; background: var(--espresso); border-radius: var(--radius); padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; z-index: 150; box-shadow: 0 8px 30px rgba(26,15,10,0.4); transform: translateY(200px); transition: transform 0.3s cubic-bezier(0.16,1,0.3,1); }
  .compare-bar.visible { transform: translateY(0); }
  .compare-bar-text { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--crema-light); letter-spacing: 1px; }
  .compare-bar-btn { background: var(--crema); color: var(--espresso); border: none; padding: 8px 16px; border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; font-weight: 500; }

  /* Chart styles */
  .grinder-bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .grinder-bar-name { font-family: 'DM Mono', monospace; font-size: 9px; width: 100px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grinder-bar-track { flex: 1; height: 26px; position: relative; background: rgba(26,15,10,0.04); border-radius: 6px; }
  .grinder-bar-fill { position: absolute; top: 3px; height: 20px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 8px; color: white; padding: 0 4px; overflow: hidden; white-space: nowrap; }
  .grind-axis { display: flex; justify-content: space-between; margin-top: 6px; }
  .grind-axis-label { font-family: 'DM Mono', monospace; font-size: 8px; color: var(--text-muted); }

  /* Recipe library cards */
  .recipe-lib-card { background:var(--card); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:12px; overflow:hidden; box-shadow:0 2px 8px rgba(26,15,10,0.05); }
  .recipe-lib-header { background:var(--espresso); padding:12px 16px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .recipe-lib-title { font-size:15px; color:var(--crema-light); line-height:1.3; flex:1; }
  .recipe-lib-author { font-family:'DM Mono',monospace; font-size:9px; color:rgba(245,237,227,.45); letter-spacing:.5px; margin-top:2px; }
  .recipe-lib-body { padding:12px 16px; }
  .recipe-lib-meta { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:10px; }
  .recipe-lib-steps { padding-left:16px; margin:0; }
  .recipe-lib-steps li { font-size:12px; color:var(--text-muted); line-height:1.6; margin-bottom:3px; }
  .recipe-lib-actions { display:flex; gap:8px; padding:10px 16px 14px; }
  #recipe-method-filter { overflow-x:auto; padding-bottom:4px; flex-wrap:nowrap !important; }
  #recipe-method-filter .type-btn { white-space:nowrap; flex-shrink:0; }

  .step-row { display:flex; gap:8px; align-items:flex-start; }
  .step-row textarea { flex:1; min-height:52px; resize:none; font-size:13px; line-height:1.5; padding:8px 12px; background:var(--
